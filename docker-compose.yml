services:
  postgres:
    image: postgres:16-alpine
    container_name: api_sentinel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-api_sentinel}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-api_sentinel}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - api_sentinel_network

  redis:
    image: redis:7-alpine
    container_name: api_sentinel_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - api_sentinel_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_sentinel_app
    restart: unless-stopped
    command: sh -c "npm run db:init && npm start"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/api_sentinel}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: 3000
      NODE_ENV: production
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - api_sentinel_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_sentinel_worker
    restart: unless-stopped
    command: npm run worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/api_sentinel}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: production
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api_sentinel_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  api_sentinel_network:
    driver: bridge
